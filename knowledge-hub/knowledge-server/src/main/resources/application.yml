server:
  port: 8081

spring:
  application:
    name: knowledge-hub
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge_hub?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  data:
    redis:
      host: localhost
      port: 6379
      # password:          # Redis 没设密码就留空
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model:

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: knowledge-hub-dev-secret-key-change-me-0123456789abcdef
  expire: 86400

minio:
  endpoint: http://localhost:9000
  access-key:
  secret-key:

storage:
  type: rustfs         # rustfs 或 local
  local:
    base-path: C:/knowledge-files   # 本地兜底存储目录
  rustfs:
    endpoint: http://localhost:9000
    access-key:
    secret-key: 
    bucket: knowledge-files

springdoc:
  api-docs:
    enabled: true

logging:
  level:
    org.springframework.ai: DEBUG
